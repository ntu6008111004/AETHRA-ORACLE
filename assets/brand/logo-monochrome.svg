<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- AETHRA ORACLE — Celestial Symbol Mark (Monochrome High-Contrast) -->
  <circle cx="100" cy="100" r="82" stroke="currentColor" stroke-width="2"/>
  <circle cx="100" cy="100" r="76" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Cardinal Tick Markers -->
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="18" x2="100" y2="24"/>
    <line x1="100" y1="176" x2="100" y2="182"/>
    <line x1="18" y1="100" x2="24" y2="100"/>
    <line x1="176" y1="100" x2="182" y2="100"/>
    <line x1="42" y1="42" x2="47" y2="47"/>
    <line x1="153" y1="153" x2="158" y2="158"/>
    <line x1="158" y1="42" x2="153" y2="47"/>
    <line x1="47" y1="153" x2="42" y2="158"/>
  </g>

  <!-- Tilted Ecliptic Ring -->
  <ellipse cx="100" cy="100" rx="68" ry="32" transform="rotate(-23.5 100 100)" stroke="currentColor" stroke-width="1.5"/>

  <!-- Crescent Geometry -->
  <path d="M 60,100 A 40,40 0 0,1 140,100 A 40,46 0 0,0 60,100 Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/>

  <!-- Celestial Cross Axis -->
  <line x1="100" y1="36" x2="100" y2="164" stroke="currentColor" stroke-width="1"/>
  <line x1="36" y1="100" x2="164" y2="100" stroke="currentColor" stroke-width="1"/>

  <!-- Central Star of AETHRA -->
  <polygon points="100,68 103.5,94 126,88 106,100 126,112 103.5,106 100,132 96.5,106 74,112 94,100 74,88 96.5,94" fill="currentColor"/>
  
  <!-- Axis Node -->
  <circle cx="100" cy="100" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="1.5" fill="currentColor"/>

  <!-- Node Pearls -->
  <circle cx="48" cy="78" r="2.5" fill="currentColor"/>
  <circle cx="152" cy="122" r="2.5" fill="currentColor"/>
  <circle cx="100" cy="24" r="2" fill="currentColor"/>
  <circle cx="100" cy="176" r="2" fill="currentColor"/>
</svg>
