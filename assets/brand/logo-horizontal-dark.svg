<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%" fill="none">
  <!-- AETHRA ORACLE — Horizontal Header Lockup (Dark Background) -->
  <defs>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997738"/>
    </linearGradient>
    <linearGradient id="hSymbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFAB"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6E32"/>
    </linearGradient>
  </defs>

  <!-- Left Symbol Mark (44x44 centered at x:30, y:30) -->
  <g transform="translate(8, 8) scale(0.22)">
    <circle cx="100" cy="100" r="82" stroke="url(#hSymbolGrad)" stroke-width="2.5" stroke-opacity="0.9"/>
    <circle cx="100" cy="100" r="76" stroke="url(#hSymbolGrad)" stroke-width="1.2" stroke-dasharray="3 5" stroke-opacity="0.6"/>

    <g stroke="url(#hSymbolGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="100" y1="18" x2="100" y2="25"/>
      <line x1="100" y1="175" x2="100" y2="182"/>
      <line x1="18" y1="100" x2="25" y2="100"/>
      <line x1="175" y1="100" x2="182" y2="100"/>
    </g>

    <ellipse cx="100" cy="100" rx="68" ry="32" transform="rotate(-23.5 100 100)" stroke="url(#hSymbolGrad)" stroke-width="2" stroke-opacity="0.9"/>
    <path d="M 60,100 A 40,40 0 0,1 140,100 A 40,46 0 0,0 60,100 Z" fill="url(#hSymbolGrad)" fill-opacity="0.25" stroke="url(#hSymbolGrad)" stroke-width="1.5"/>

    <polygon points="100,68 103.5,94 126,88 106,100 126,112 103.5,106 100,132 96.5,106 74,112 94,100 74,88 96.5,94" fill="url(#hSymbolGrad)"/>
    <circle cx="100" cy="100" r="5" fill="#0C0D10" stroke="url(#hSymbolGrad)" stroke-width="2"/>
    <circle cx="100" cy="100" r="2" fill="#F5F2EB"/>

    <circle cx="48" cy="78" r="3" fill="#E5C378"/>
    <circle cx="152" cy="122" r="3" fill="#E5C378"/>
  </g>

  <!-- Typography -->
  <!-- AETHRA -->
  <text x="68" y="34" font-family="'Cinzel', 'Cinzel Decorative', 'Cormorant Garamond', 'Georgia', serif" font-size="21" font-weight="600" letter-spacing="4.5" fill="url(#hGoldGrad)">AETHRA</text>
  
  <!-- ORACLE -->
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="500" letter-spacing="4" fill="#C5BDB0" opacity="0.85">ORACLE</text>

  <!-- Subtle Editorial Vertical Separator -->
  <line x1="175" y1="20" x2="175" y2="44" stroke="url(#hSymbolGrad)" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Tagline Thai / Mini Descriptor -->
  <text x="186" y="31" font-family="'Sarabun', 'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="400" letter-spacing="0.5" fill="#9BA1AD" opacity="0.85">เอธรา ออราเคิล</text>
  <text x="186" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7" font-weight="400" letter-spacing="1" fill="#717684" opacity="0.8">OBSERVATORY</text>
</svg>
