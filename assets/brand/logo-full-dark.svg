<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <!-- AETHRA ORACLE — Full Brand Lockup (Dark Background) -->
  <defs>
    <radialGradient id="fullGlowDark" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E5C378" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0C0D10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997738"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFAB"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6E32"/>
    </linearGradient>
  </defs>

  <rect width="400" height="320" fill="#0C0D10"/>
  <circle cx="200" cy="95" r="90" fill="url(#fullGlowDark)"/>

  <!-- Symbol Mark (Centered at 200, 95) -->
  <g transform="translate(130, 25) scale(0.7)">
    <circle cx="100" cy="100" r="82" stroke="url(#goldGrad)" stroke-width="1.75" stroke-opacity="0.85"/>
    <circle cx="100" cy="100" r="76" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 4" stroke-opacity="0.5"/>

    <g stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
      <line x1="100" y1="18" x2="100" y2="24"/>
      <line x1="100" y1="176" x2="100" y2="182"/>
      <line x1="18" y1="100" x2="24" y2="100"/>
      <line x1="176" y1="100" x2="182" y2="100"/>
      <line x1="42" y1="42" x2="47" y2="47"/>
      <line x1="153" y1="153" x2="158" y2="158"/>
      <line x1="158" y1="42" x2="153" y2="47"/>
      <line x1="47" y1="153" x2="42" y2="158"/>
    </g>

    <ellipse cx="100" cy="100" rx="68" ry="32" transform="rotate(-23.5 100 100)" stroke="url(#goldGrad)" stroke-width="1.4" stroke-opacity="0.9"/>
    <path d="M 60,100 A 40,40 0 0,1 140,100 A 40,46 0 0,0 60,100 Z" fill="url(#goldGrad)" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="1"/>

    <line x1="100" y1="36" x2="100" y2="164" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.6"/>
    <line x1="36" y1="100" x2="164" y2="100" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.6"/>

    <polygon points="100,68 103.5,94 126,88 106,100 126,112 103.5,106 100,132 96.5,106 74,112 94,100 74,88 96.5,94" fill="url(#goldGrad)"/>
    <circle cx="100" cy="100" r="4.5" fill="#0C0D10" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="1.5" fill="#F5F2EB"/>

    <circle cx="48" cy="78" r="2.2" fill="#E5C378"/>
    <circle cx="152" cy="122" r="2.2" fill="#E5C378"/>
    <circle cx="100" cy="24" r="1.8" fill="#F5F2EB"/>
    <circle cx="100" cy="176" r="1.8" fill="#F5F2EB"/>
  </g>

  <!-- Typography -->
  <!-- AETHRA -->
  <text x="200" y="210" text-anchor="middle" font-family="'Cinzel', 'Cinzel Decorative', 'Cormorant Garamond', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="600" letter-spacing="9" fill="url(#goldTextGrad)">AETHRA</text>
  
  <!-- ORACLE -->
  <text x="200" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="8" fill="#D5CDBC" opacity="0.9">ORACLE</text>

  <!-- Celestial Divider & Coordinates -->
  <line x1="120" y1="262" x2="280" y2="262" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="200" cy="262" r="2" fill="#C5A059"/>
  <circle cx="120" cy="262" r="1" fill="#C5A059"/>
  <circle cx="280" cy="262" r="1" fill="#C5A059"/>

  <text x="200" y="284" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Sarabun', sans-serif" font-size="9" font-weight="400" letter-spacing="3" fill="#8E939E">CELESTIAL OBSERVATORY &amp; DIVINATION</text>
</svg>
