<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%" fill="none">
  <!-- AETHRA ORACLE — Horizontal Header Lockup (Light Parchment Background) -->
  <defs>
    <linearGradient id="hGoldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5A1E"/>
      <stop offset="50%" stop-color="#9E7B36"/>
      <stop offset="100%" stop-color="#4D380E"/>
    </linearGradient>
    <linearGradient id="hSymbolGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6E32"/>
      <stop offset="50%" stop-color="#A67C2E"/>
      <stop offset="100%" stop-color="#5C4518"/>
    </linearGradient>
  </defs>

  <!-- Left Symbol Mark -->
  <g transform="translate(8, 8) scale(0.22)">
    <circle cx="100" cy="100" r="82" stroke="url(#hSymbolGradLight)" stroke-width="2.5" stroke-opacity="0.9"/>
    <circle cx="100" cy="100" r="76" stroke="url(#hSymbolGradLight)" stroke-width="1.2" stroke-dasharray="3 5" stroke-opacity="0.6"/>

    <g stroke="url(#hSymbolGradLight)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="100" y1="18" x2="100" y2="25"/>
      <line x1="100" y1="175" x2="100" y2="182"/>
      <line x1="18" y1="100" x2="25" y2="100"/>
      <line x1="175" y1="100" x2="182" y2="100"/>
    </g>

    <ellipse cx="100" cy="100" rx="68" ry="32" transform="rotate(-23.5 100 100)" stroke="url(#hSymbolGradLight)" stroke-width="2" stroke-opacity="0.9"/>
    <path d="M 60,100 A 40,40 0 0,1 140,100 A 40,46 0 0,0 60,100 Z" fill="url(#hSymbolGradLight)" fill-opacity="0.2" stroke="url(#hSymbolGradLight)" stroke-width="1.5"/>

    <polygon points="100,68 103.5,94 126,88 106,100 126,112 103.5,106 100,132 96.5,106 74,112 94,100 74,88 96.5,94" fill="url(#hSymbolGradLight)"/>
    <circle cx="100" cy="100" r="5" fill="#F5F2EB" stroke="url(#hSymbolGradLight)" stroke-width="2"/>
    <circle cx="100" cy="100" r="2" fill="#5C4518"/>

    <circle cx="48" cy="78" r="3" fill="#8F6E32"/>
    <circle cx="152" cy="122" r="3" fill="#8F6E32"/>
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="'Cinzel', 'Cinzel Decorative', 'Cormorant Garamond', 'Georgia', serif" font-size="21" font-weight="600" letter-spacing="4.5" fill="url(#hGoldGradLight)">AETHRA</text>
  
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="4" fill="#3D372E" opacity="0.9">ORACLE</text>

  <line x1="175" y1="20" x2="175" y2="44" stroke="url(#hSymbolGradLight)" stroke-width="0.75" stroke-opacity="0.4"/>

  <text x="186" y="31" font-family="'Sarabun', 'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" letter-spacing="0.5" fill="#5C5549">เอธรา ออราเคิล</text>
  <text x="186" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7" font-weight="500" letter-spacing="1" fill="#7A7263">OBSERVATORY</text>
</svg>
