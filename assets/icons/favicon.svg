<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- AETHRA ORACLE — Favicon Symbol -->
  <rect width="64" height="64" rx="14" fill="#0C0D10"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="32" cy="32" r="26" stroke="#C5A059" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="23" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="1.5 2.5" stroke-opacity="0.6"/>

  <!-- Cardinal Coordinates -->
  <line x1="32" y1="6" x2="32" y2="9" stroke="#E5C378" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="55" x2="32" y2="58" stroke="#E5C378" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="9" y2="32" stroke="#E5C378" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="55" y1="32" x2="58" y2="32" stroke="#E5C378" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Tilted Celestial Ecliptic Ring -->
  <ellipse cx="32" cy="32" rx="21" ry="9" transform="rotate(-24 32 32)" stroke="#E5C378" stroke-width="1.5"/>

  <!-- Core Celestial 8-Point Compass Star -->
  <polygon points="32,20 33.3,30 39,27 34.5,32 39,37 33.3,34 32,44 30.7,34 25,37 29.5,32 25,27 30.7,30" fill="#F2DFAB"/>

  <!-- Central Luminary Node -->
  <circle cx="32" cy="32" r="2" fill="#0C0D10" stroke="#E5C378" stroke-width="1"/>
  <circle cx="32" cy="32" r="0.7" fill="#FFFFFF"/>
</svg>
